name: Documentation links

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test the checker
        run: uv run --locked --project scripts --python 3.13 python -m unittest discover -s scripts/tests -v
      - name: Check repository Markdown
        run: uv run --locked --project scripts --python 3.13 python scripts/check_doc_links.py
