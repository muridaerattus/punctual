[project]
name = "punctual-backend"
version = "0.1.0"
description = "Lightweight kanban board for humans and agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "fastmcp>=4.0.9,<5",
    "mcp>=2.2,<3",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "typer>=0.15",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.15,<2",
    "pydantic-settings>=2.0,<3",
    "pydantic>=2.12,<3",
]

[project.scripts]
punctual = "punctual.cli.app:app"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["punctual"]
